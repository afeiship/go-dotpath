name: golang-library
files:
  - '*.*'
  - '.*'
  - '*'
  - '__tests__/*.go'
  - '!node_modules'
  - '!rif.config.yaml'
replacements:
  - from: /golang-library-description/g
    to: Get, set, update, and save nested maps using dot notation.
  - from: /golang-library/g
    to: ${PROJECT_NAME}
  - from: /pkgname/g
    to: dotpath
